<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>npm start</title>
<style>
@font-face{font-family:'Archivo Black';src:url('../../../presentation/fonts/archivo-black-latin-400.woff2') format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Inter';src:url('../../../presentation/fonts/inter-latin-var.woff2') format('woff2');font-weight:100 900;font-display:block}
@font-face{font-family:'JetBrains Mono';src:url('../../../presentation/fonts/jetbrains-mono-latin-var.woff2') format('woff2');font-weight:100 800;font-display:block}
:root{--bg:#0b0d10;--panel:#12161b;--ink:#f3f5f6;--dim:#c3cbd1;--faint:#8d979f;--rule:#2b333b;--red:#ff5a52;--red-bg:#2a1214;--green:#3ddc84;--green-bg:#0f2519;
--sans:'Inter','Segoe UI',sans-serif;--mono:'JetBrains Mono',Consolas,'Segoe UI Emoji','Segoe UI Symbol',monospace}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{display:inline-block}
.frame{width:1200px;padding:44px 52px 48px;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:20px;line-height:1.35}
.kicker{font-family:var(--mono);font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding-bottom:16px;border-bottom:1px solid var(--rule);margin-bottom:32px}
.kicker b{color:var(--green);font-weight:600}
.mono{font-family:var(--mono)}
.box{border:1px solid var(--rule);background:var(--panel);border-radius:3px;padding:16px 20px}
.box .t{font-family:var(--mono);font-size:18px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.box .v{font-size:22px;font-weight:600}
.box .s{font-size:18px;color:var(--dim);margin-top:4px}
.red{color:var(--red)} .green{color:var(--green)} .dim{color:var(--dim)} .faint{color:var(--faint)}
.box.bad{border-color:var(--red);background:var(--red-bg)}
.box.good{border-color:var(--green);background:var(--green-bg)}
.tag{display:inline-flex;gap:10px;align-items:baseline;border:1px solid var(--green);color:var(--green);background:var(--green-bg);border-radius:3px;padding:6px 12px;font-size:18px;line-height:1.3}
.tag .n{font-family:var(--mono);font-weight:700}
.tag .d{color:var(--ink)}
.arrow{display:flex;align-items:center;justify-content:center;color:var(--dim)}
.arrow svg{display:block}
.foot{margin-top:28px;font-size:18px;color:var(--faint)}

.frame{padding:36px 40px}
.win{border:1px solid var(--rule);border-radius:4px;background:#07090b}
.bar{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--panel)}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:var(--rule);display:block}
.tt{font-size:18px;color:var(--dim)}
.body{padding:20px 24px;font-size:19px;line-height:1.5}
.l{white-space:pre-wrap;padding-left:3ch;text-indent:-3ch;color:var(--dim)}
.l.cmd{color:var(--faint)}
.l.ok{color:var(--green)}
.l.bad{color:var(--red)}
.l.ink{color:var(--ink)}

</style></head>
<body><div class="frame">
<div class="win"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span class="tt mono">npm start</span></div><div class="body mono"><div class="l bad">Model Armor flagged complaint-4471.txt as prompt injection. It will be withheld while Security is ON.</div><div class="l ok">📄 Loaded 3 documents from gs://PROJECT-securebank-docs-clean</div><div class="l ">Server listening on port 8080</div><div class="l ">✅ Connected to Google Cloud Project: PROJECT</div></div></div>
</div></body></html>
