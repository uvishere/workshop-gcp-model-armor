worker_processes  1;
error_log  /dev/stderr warn;
pid        /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /dev/stdout;
  sendfile      on;

  # Cloud Run hands the port in at runtime; nginx cannot read env vars in
  # config, so the entrypoint substitutes ${PORT} before starting.
  server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # The codelab is served at the web root so a Cloudflare route can map a
    # path prefix straight onto this service without a rewrite.
    # Static site: a missing path is a 404, not a silent fallback to the
    # codelab. Matches the behaviour of the service this replaces.
    location / {
      try_files $uri $uri/ =404;
    }
  }
}
